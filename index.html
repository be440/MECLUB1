<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="A simple personal links page" />
    <title>My Links</title>

    <style>
      :root {
        --text: #ffffff;
        --muted-text: rgba(255, 255, 255, 0.78);
        --button-bg: rgba(255, 255, 255, 0.14);
        --button-border: rgba(255, 255, 255, 0.25);
        --button-hover: rgba(255, 255, 255, 0.24);
        --shadow: 0 18px 50px rgba(0, 0, 0, 0.22);
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        min-height: 100%;
        margin: 0;
      }

      body {
        display: grid;
        place-items: center;
        padding: 32px 18px;
        color: var(--text);
        font-family:
          Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont,
          "Segoe UI", sans-serif;
        background: linear-gradient(145deg, #6d28d9, #2563eb 55%, #0891b2);
        background-attachment: fixed;
        background-position: center;
        background-size: cover;
      }

      .page {
        width: min(100%, 560px);
        text-align: center;
      }

      .profile {
        margin-bottom: 28px;
      }

      .logo {
        display: grid;
        width: 104px;
        height: 104px;
        margin: 0 auto 18px;
        place-items: center;
        overflow: hidden;
        border: 3px solid rgba(255, 255, 255, 0.76);
        border-radius: 50%;
        background: rgba(255, 255, 255, 0.18);
        box-shadow: var(--shadow);
        font-size: 31px;
        font-weight: 800;
        letter-spacing: 0.04em;
        backdrop-filter: blur(12px);
      }

      .logo img {
        width: 100%;
        height: 100%;
        object-fit: cover;
      }

      h1 {
        margin: 0;
        font-size: clamp(1.75rem, 6vw, 2.35rem);
        line-height: 1.15;
        letter-spacing: -0.035em;
      }

      .bio {
        margin: 9px auto 0;
        color: var(--muted-text);
        font-size: 1rem;
        line-height: 1.55;
      }

      .links {
        display: grid;
        gap: 14px;
      }

      .link {
        display: grid;
        grid-template-columns: 42px 1fr 42px;
        align-items: center;
        min-height: 68px;
        padding: 10px 13px;
        border: 1px solid var(--button-border);
        border-radius: 18px;
        color: var(--text);
        background: var(--button-bg);
        box-shadow: 0 9px 25px rgba(0, 0, 0, 0.13);
        text-decoration: none;
        backdrop-filter: blur(14px);
        transition:
          transform 180ms ease,
          background-color 180ms ease,
          box-shadow 180ms ease;
      }

      .link:hover {
        transform: translateY(-3px);
        background: var(--button-hover);
        box-shadow: 0 14px 32px rgba(0, 0, 0, 0.2);
      }

      .link:focus-visible {
        outline: 3px solid #ffffff;
        outline-offset: 4px;
      }

      .link-icon {
        display: grid;
        width: 42px;
        height: 42px;
        place-items: center;
        border-radius: 13px;
        background: rgba(255, 255, 255, 0.14);
        font-size: 1.3rem;
      }

      .link-name {
        padding: 0 12px;
        font-size: 1.02rem;
        font-weight: 700;
      }

      .arrow {
        font-size: 1.35rem;
        opacity: 0.72;
        transition: transform 180ms ease;
      }

      .link:hover .arrow {
        transform: translateX(3px);
      }

      footer {
        margin-top: 28px;
        color: rgba(255, 255, 255, 0.64);
        font-size: 0.82rem;
      }

      @media (prefers-reduced-motion: reduce) {
        .link,
        .arrow {
          transition: none;
        }
      }
    </style>
  </head>

  <body>
    <main class="page">
      <section class="profile" aria-labelledby="profile-name">
        <div class="logo" id="logo" aria-label="Profile logo"></div>
        <h1 id="profile-name"></h1>
        <p class="bio" id="bio"></p>
      </section>

      <nav class="links" id="links" aria-label="My links"></nav>
      <footer id="footer"></footer>
    </main>

    <script>
      /* ================================================================
         EDIT ONLY THIS SECTION to personalize your page.
         For a background image, try:
         background: "url('your-background.jpg') center / cover fixed"
         ================================================================= */
      const CONFIG = {
        pageTitle: "My Links",
        profileName: "Your Name",
        bio: "Welcome! Find me everywhere below.",

        // Add an image URL here. Leave it empty to show logoText instead.
        logoImage: "",
        logoText: "YN",

        background:
          "linear-gradient(145deg, #6d28d9, #2563eb 55%, #0891b2)",

        links: [
          {
            name: "My Website",
            url: "https://example.com",
            icon: "🌐",
          },
          {
            name: "Instagram",
            url: "https://instagram.com",
            icon: "📸",
          },
          {
            name: "YouTube",
            url: "https://youtube.com",
            icon: "▶️",
          },
        ],

        footerText: "Made with care",
      };

      /* Page setup — no changes are needed below this line. */
      document.title = CONFIG.pageTitle;
      document.body.style.background = CONFIG.background;
      document.getElementById("profile-name").textContent = CONFIG.profileName;
      document.getElementById("bio").textContent = CONFIG.bio;
      document.getElementById("footer").textContent = CONFIG.footerText;

      const logo = document.getElementById("logo");

      if (CONFIG.logoImage.trim()) {
        const image = document.createElement("img");
        image.src = CONFIG.logoImage;
        image.alt = `${CONFIG.profileName} logo`;
        image.addEventListener("error", () => {
          logo.textContent = CONFIG.logoText;
        });
        logo.appendChild(image);
      } else {
        logo.textContent = CONFIG.logoText;
      }

      const linksContainer = document.getElementById("links");

      CONFIG.links.forEach((item) => {
        const link = document.createElement("a");
        link.className = "link";
        link.href = item.url;
        link.target = "_blank";
        link.rel = "noopener noreferrer";

        const icon = document.createElement("span");
        icon.className = "link-icon";
        icon.setAttribute("aria-hidden", "true");
        icon.textContent = item.icon;

        const name = document.createElement("span");
        name.className = "link-name";
        name.textContent = item.name;

        const arrow = document.createElement("span");
        arrow.className = "arrow";
        arrow.setAttribute("aria-hidden", "true");
        arrow.textContent = "→";

        link.append(icon, name, arrow);
        linksContainer.appendChild(link);
      });
    </script>
  </body>
</html><!doctype html>
