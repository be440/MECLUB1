<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="Official links for the Mechanical Engineering Club"
    />
    <title>Mechanical Engineering Club</title>

    <style>
      :root {
        --accent: #ff7626;
        --ink: #151515;
        --paper: #f7f7f4;
        --page-background:
          radial-gradient(circle at 18% 8%, rgba(255, 118, 38, 0.2), transparent 27rem),
          radial-gradient(circle at 90% 88%, rgba(255, 118, 38, 0.11), transparent 24rem),
          #111111;
      }

      * {
        box-sizing: border-box;
      }

      html {
        min-height: 100%;
      }

      body {
        min-height: 100vh;
        margin: 0;
        overflow-x: hidden;
        color: #ffffff;
        background: var(--page-background);
        font-family:
          Inter, "Segoe UI", Tahoma, Arial, sans-serif;
      }

      body::before {
        position: fixed;
        z-index: -1;
        inset: 0;
        background-image:
          linear-gradient(rgba(255, 255, 255, 0.035) 1px, transparent 1px),
          linear-gradient(90deg, rgba(255, 255, 255, 0.035) 1px, transparent 1px);
        background-size: 38px 38px;
        content: "";
        mask-image: linear-gradient(to bottom, black, transparent 92%);
      }

      body::after {
        position: fixed;
        z-index: -1;
        top: -120px;
        right: -150px;
        width: 380px;
        height: 380px;
        border: 52px solid rgba(255, 118, 38, 0.08);
        border-radius: 50%;
        content: "";
      }

      .page {
        width: min(100%, 650px);
        margin: 0 auto;
        padding: 42px 20px 34px;
      }

      .panel {
        position: relative;
        overflow: hidden;
        padding: clamp(28px, 6vw, 48px);
        border: 1px solid rgba(255, 255, 255, 0.12);
        border-radius: 34px;
        background: rgba(20, 20, 20, 0.82);
        box-shadow: 0 28px 80px rgba(0, 0, 0, 0.38);
        backdrop-filter: blur(18px);
      }

      .panel::before {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 7px;
        background: var(--accent);
        content: "";
      }

      .profile {
        text-align: center;
      }

      .logo-frame {
        position: relative;
        width: 142px;
        height: 142px;
        margin: 0 auto 24px;
        padding: 8px;
        border: 2px solid var(--ink);
        border-radius: 28px;
        background: #ffffff;
        box-shadow: 10px 10px 0 var(--accent);
        transform: rotate(-1.5deg);
      }

      .logo-frame::after {
        position: absolute;
        right: -15px;
        bottom: 17px;
        width: 30px;
        height: 5px;
        background: #ffffff;
        content: "";
      }

      .logo-frame img {
        display: block;
        width: 100%;
        height: 100%;
        border-radius: 20px;
        object-fit: cover;
      }

      .logo-fallback {
        display: none;
        width: 100%;
        height: 100%;
        place-items: center;
        border-radius: 20px;
        color: var(--ink);
        background: #ffffff;
        font-size: 2.2rem;
        font-weight: 900;
      }

      .eyebrow {
        margin: 0 0 9px;
        color: var(--accent);
        font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
        font-size: 0.75rem;
        font-weight: 800;
        letter-spacing: 0.2em;
        text-transform: uppercase;
      }

      h1 {
        max-width: 490px;
        margin: 0 auto;
        font-size: clamp(2rem, 7vw, 3.25rem);
        line-height: 0.98;
        letter-spacing: -0.055em;
      }

      .arabic-name {
        margin: 13px 0 0;
        color: rgba(255, 255, 255, 0.86);
        font-size: clamp(1.1rem, 4vw, 1.38rem);
        font-weight: 700;
        line-height: 1.5;
      }

      .divider {
        display: flex;
        align-items: center;
        width: 138px;
        margin: 23px auto 18px;
        gap: 8px;
      }

      .divider::before,
      .divider::after {
        height: 2px;
        flex: 1;
        background: rgba(255, 255, 255, 0.26);
        content: "";
      }

      .divider span {
        width: 11px;
        height: 11px;
        border: 3px solid var(--accent);
        border-radius: 50%;
      }

      .bio {
        max-width: 440px;
        margin: 0 auto;
        color: rgba(255, 255, 255, 0.64);
        font-size: 0.98rem;
        line-height: 1.65;
      }

      .links {
        display: grid;
        margin-top: 32px;
        gap: 13px;
      }

      .link {
        display: grid;
        grid-template-columns: 46px minmax(0, 1fr) 44px;
        align-items: center;
        min-height: 78px;
        padding: 11px 13px;
        overflow: hidden;
        border: 2px solid transparent;
        border-radius: 19px;
        color: var(--ink);
        background: var(--paper);
        box-shadow: 0 10px 24px rgba(0, 0, 0, 0.17);
        text-align: left;
        text-decoration: none;
        transition:
          transform 180ms ease,
          border-color 180ms ease,
          background-color 180ms ease,
          box-shadow 180ms ease;
      }

      .link:hover {
        transform: translateY(-3px);
        border-color: var(--accent);
        background: #ffffff;
        box-shadow: 0 15px 34px rgba(0, 0, 0, 0.27);
      }

      .link:focus-visible {
        outline: 3px solid var(--accent);
        outline-offset: 4px;
      }

      .link-number {
        display: grid;
        width: 42px;
        height: 42px;
        place-items: center;
        border-radius: 12px;
        color: #ffffff;
        background: var(--ink);
        font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
        font-size: 0.76rem;
        font-weight: 800;
      }

      .link-copy {
        min-width: 0;
        padding: 0 13px;
      }

      .link-name {
        display: block;
        overflow: hidden;
        font-size: 1rem;
        font-weight: 850;
        line-height: 1.25;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .link-description {
        display: block;
        margin-top: 3px;
        overflow: hidden;
        color: #6a6a66;
        font-size: 0.78rem;
        line-height: 1.3;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .link-arrow {
        display: grid;
        width: 40px;
        height: 40px;
        place-items: center;
        border-radius: 50%;
        color: var(--ink);
        background: var(--accent);
        font-size: 1.35rem;
        font-weight: 900;
        transition: transform 180ms ease;
      }

      .link:hover .link-arrow {
        transform: rotate(-8deg) translateX(2px);
      }

      footer {
        display: flex;
        align-items: center;
        justify-content: center;
        margin-top: 27px;
        color: rgba(255, 255, 255, 0.45);
        font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
        font-size: 0.72rem;
        letter-spacing: 0.08em;
        text-align: center;
        text-transform: uppercase;
      }

      footer::before {
        width: 24px;
        height: 3px;
        margin-right: 9px;
        background: var(--accent);
        content: "";
      }

      @media (max-width: 480px) {
        .page {
          padding: 18px 12px;
        }

        .panel {
          padding: 31px 16px 26px;
          border-radius: 26px;
        }

        .logo-frame {
          width: 122px;
          height: 122px;
          border-radius: 24px;
        }

        .link {
          grid-template-columns: 42px minmax(0, 1fr) 38px;
          min-height: 72px;
          padding: 9px 10px;
        }

        .link-number {
          width: 38px;
          height: 38px;
        }

        .link-arrow {
          width: 36px;
          height: 36px;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        .link,
        .link-arrow {
          transition: none;
        }
      }
    </style>
  </head>

  <body>
    <main class="page">
      <section class="panel" aria-labelledby="club-name">
        <header class="profile">
          <div class="logo-frame">
            <img id="club-logo" alt="Mechanical Engineering Club logo" />
            <span class="logo-fallback" id="logo-fallback" aria-hidden="true">MEC</span>
          </div>

          <p class="eyebrow" id="eyebrow"></p>
          <h1 id="club-name"></h1>
          <p class="arabic-name" id="arabic-name" lang="ar" dir="rtl"></p>
          <div class="divider" aria-hidden="true"><span></span></div>
          <p class="bio" id="bio"></p>
        </header>

        <nav class="links" id="links" aria-label="Club links"></nav>
        <footer id="footer"></footer>
      </section>
    </main>

        links: [
          {
            name: "Club WA community ",
            description: "News, activities, and club information",
            url: "https://example.com",
          },
          {
            name: "Linkedin",
            description: "Follow our latest events and updates",
            url: "https://www.linkedin.com/company/kfupm-mechanical-engineering-club/",
          },
          {
            name: "X",
            description: "Questions, partnerships, and membership",
            url: "https://x.com/meckfupm?s=11",
          },
        ],

      };

      /* Page setup — no changes are needed below this line. */
      const root = document.documentElement;
      root.style.setProperty("--accent", CONFIG.accentColor);
      root.style.setProperty("--page-background", CONFIG.background);

      document.title = CONFIG.pageTitle;
      document.getElementById("eyebrow").textContent = CONFIG.eyebrow;
      document.getElementById("club-name").textContent = CONFIG.clubName;
      document.getElementById("arabic-name").textContent = CONFIG.clubNameArabic;
      document.getElementById("bio").textContent = CONFIG.bio;
      document.getElementById("footer").textContent = CONFIG.footerText;

      const logo = document.getElementById("club-logo");
      const logoFallback = document.getElementById("logo-fallback");
      logo.src = CONFIG.logoImage;
      logo.alt = `${CONFIG.clubName} logo`;
      logo.addEventListener("error", () => {
        logo.style.display = "none";
        logoFallback.style.display = "grid";
      });

      const linksContainer = document.getElementById("links");

      CONFIG.links.forEach((item, index) => {
        const link = document.createElement("a");
        link.className = "link";
        link.href = item.url;
        link.target = "_blank";
        link.rel = "noopener noreferrer";
        link.setAttribute("aria-label", `${item.name}: ${item.description}`);

        const number = document.createElement("span");
        number.className = "link-number";
        number.setAttribute("aria-hidden", "true");
        number.textContent = String(index + 1).padStart(2, "0");

        const copy = document.createElement("span");
        copy.className = "link-copy";

        const name = document.createElement("span");
        name.className = "link-name";
        name.textContent = item.name;

        const description = document.createElement("span");
        description.className = "link-description";
        description.textContent = item.description;

        const arrow = document.createElement("span");
        arrow.className = "link-arrow";
        arrow.setAttribute("aria-hidden", "true");
        arrow.textContent = "↗";

        copy.append(name, description);
        link.append(number, copy, arrow);
        linksContainer.appendChild(link);
      });
